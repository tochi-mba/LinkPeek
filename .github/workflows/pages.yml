name: Build extension and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Only the newest commit should be published. This also prevents a hung
  # browser installation from blocking every later deployment.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ALLOW_MISSING_DOWNLOADS=1 node scripts/check_site.mjs
      - run: timeout 4m npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Package CRX
        env:
          LINKPEEK_CRX_KEY_B64: ${{ secrets.LINKPEEK_CRX_KEY_B64 }}
        run: |
          set -euxo pipefail
          CHROMIUM=$(node -e "const {chromium}=require('@playwright/test'); process.stdout.write(chromium.executablePath())")
          test -x "$CHROMIUM"
          if [ -n "$LINKPEEK_CRX_KEY_B64" ]; then
            printf '%s' "$LINKPEEK_CRX_KEY_B64" | base64 -d > linkpeek.pem
            "$CHROMIUM" --no-sandbox --pack-extension="$GITHUB_WORKSPACE/dist" --pack-extension-key="$GITHUB_WORKSPACE/linkpeek.pem"
          else
            echo "::warning::LINKPEEK_CRX_KEY_B64 is not configured; generating a packaging key for this build. Add the secret for a stable extension ID across releases."
            "$CHROMIUM" --no-sandbox --pack-extension="$GITHUB_WORKSPACE/dist"
          fi
          mkdir -p site/downloads
          mv dist.crx site/downloads/LinkPeek.crx
          rm -f dist.pem linkpeek.pem
          sha256sum site/downloads/LinkPeek.crx > site/downloads/LinkPeek.crx.sha256
      - name: Package the download
        env:
          LINKPEEK_CRX_KEY_B64: ${{ secrets.LINKPEEK_CRX_KEY_B64 }}
        run: |
          set -euxo pipefail
          # Browsers try to install a .crx the moment it is clicked and reject self-hosted ones
          # (CRX_REQUIRED_PROOF_MISSING), so the site offers a ZIP: the unpacked extension for
          # "Load unpacked", plus the signed CRX for drag-and-drop.
          rm -rf release && mkdir -p release/LinkPeek
          cp -R dist/. release/LinkPeek/
          if [ -n "$LINKPEEK_CRX_KEY_B64" ]; then
            # The public half of the signing key gives the unpacked copy the CRX's extension ID.
            printf '%s' "$LINKPEEK_CRX_KEY_B64" | base64 -d > release.pem
            KEY=$(openssl pkey -in release.pem -pubout -outform DER | base64 -w0)
            rm -f release.pem
            node -e "const fs=require('fs');const p='release/LinkPeek/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.key=process.argv[1];fs.writeFileSync(p,JSON.stringify(m,null,2))" "$KEY"
          fi
          cp site/downloads/LinkPeek.crx release/LinkPeek.crx
          cp packaging/INSTALL.txt release/INSTALL.txt
          (cd release && zip -qr ../site/downloads/LinkPeek.zip LinkPeek LinkPeek.crx INSTALL.txt)
          unzip -l site/downloads/LinkPeek.zip | grep -q "LinkPeek/manifest.json"
          sha256sum site/downloads/LinkPeek.zip > site/downloads/LinkPeek.zip.sha256
      - run: node scripts/check_site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
