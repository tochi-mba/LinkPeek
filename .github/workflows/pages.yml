name: Build extension and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ALLOW_MISSING_DOWNLOADS=1 node scripts/check_site.mjs
      - run: timeout 4m npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Package CRX
        env:
          LINKPEEK_CRX_KEY_B64: ${{ secrets.LINKPEEK_CRX_KEY_B64 }}
        run: |
          set -euxo pipefail
          CHROMIUM=$(node -e "const {chromium}=require('@playwright/test'); process.stdout.write(chromium.executablePath())")
          test -x "$CHROMIUM"
          if [ -n "$LINKPEEK_CRX_KEY_B64" ]; then
            printf '%s' "$LINKPEEK_CRX_KEY_B64" | base64 -d > linkpeek.pem
            "$CHROMIUM" --pack-extension="$GITHUB_WORKSPACE/dist" --pack-extension-key="$GITHUB_WORKSPACE/linkpeek.pem"
          else
            echo "::warning::LINKPEEK_CRX_KEY_B64 is not configured; generating a packaging key for this build. Add the secret for a stable extension ID across releases."
            "$CHROMIUM" --pack-extension="$GITHUB_WORKSPACE/dist"
          fi
          mkdir -p site/downloads
          mv dist.crx site/downloads/LinkPeek.crx
          rm -f dist.pem linkpeek.pem
          sha256sum site/downloads/LinkPeek.crx > site/downloads/LinkPeek.crx.sha256
      - run: node scripts/check_site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
