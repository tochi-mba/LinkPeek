name: Check
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ALLOW_MISSING_DOWNLOADS=1 node scripts/check_site.mjs
      - run: npx playwright install --with-deps --no-shell chromium
      - run: timeout 4m npm run test:e2e
      - name: Package CRX smoke test
        run: |
          set -euxo pipefail
          CHROMIUM=$(node -e "const {chromium}=require('@playwright/test'); process.stdout.write(chromium.executablePath())")
          "$CHROMIUM" --pack-extension="$GITHUB_WORKSPACE/dist"
          test -s dist.crx
          rm -f dist.crx dist.pem
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
