name: Check
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check_site.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
