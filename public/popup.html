<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LinkPeek</title><link rel="stylesheet" href="base.css"><style>
body{width:360px;min-height:460px}.wrap{padding:16px}.logo{display:flex;gap:11px;align-items:center;margin-bottom:18px}.quick{display:grid;gap:10px}.quick .card{padding:14px}.site{font-size:12px;word-break:break-all}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11px}.favorites{display:grid;gap:7px;margin-top:8px;max-height:190px;overflow:auto}.favorite-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}.favorite-open{min-width:0;border:0;background:transparent;color:var(--text);text-align:left;padding:0;cursor:pointer}.favorite-open strong,.favorite-open small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.favorite-open strong{font-size:12px}.favorite-open small{font-size:10px;color:var(--muted);margin-top:2px}.favorite-remove{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.favorite-empty{font-size:11px;color:var(--muted);padding:4px 0}
</style></head><body><div class="wrap"><div class="logo"><div class="mark">LP</div><div><div class="rex">REX TECHNOLOGIES</div><div class="brand">LinkPeek</div></div></div><div class="quick"><div class="card"><div class="row"><strong>Enabled</strong><span class="spacer"></span><input id="enabled" type="checkbox"></div></div><div class="card"><div class="eyebrow">Preset</div><select id="preset" style="width:100%;margin-top:8px"><option value="balanced">Balanced</option><option value="minimal">Minimal</option><option value="fast">Fast</option><option value="touchpad">Touchpad Pro</option><option value="manual">Manual</option><option value="custom">Custom</option></select></div><div class="card"><div class="eyebrow">This site</div><div id="site" class="site muted">Loading…</div><div class="actions"><button id="disableSite" class="button ghost">Toggle site</button><button id="options" class="button">Customize</button></div></div><div class="card"><div class="row"><div><div class="eyebrow">Favorites</div><small class="muted">Press B in LinkPeek to save a link offline.</small></div><span class="spacer"></span><span id="favoriteCount" class="muted">0</span></div><div id="favorites" class="favorites"><div class="favorite-empty">No saved links yet.</div></div></div></div><div class="actions"><button id="help" class="button">Tutorial</button><button id="clear" class="button">Clear cache</button></div><div class="footer muted">A REX Technologies product.</div></div><script src="popup.js"></script></body></html>
