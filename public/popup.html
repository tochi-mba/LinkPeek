<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>LinkPeek</title>
  <link rel="stylesheet" href="base.css">
</head>
<body class="popup">
  <div class="wrap">
    <header class="logo">
      <div class="mark">LP</div>
      <div><div class="rex">REX TECHNOLOGIES</div><div class="brand">LinkPeek</div></div>
      <span class="spacer"></span>
      <label class="switch" title="Turn LinkPeek on or off"><input id="enabled" type="checkbox" aria-label="LinkPeek is on"><span class="switch-track"><span class="switch-thumb"></span></span></label>
    </header>
    <div class="quick">
      <section class="card">
        <div class="row"><div class="eyebrow">This page</div><span class="spacer"></span><span id="site" class="site muted">Loading…</span></div>
        <p id="status" class="status" role="status"></p>
        <div class="actions two">
          <button id="pauseSite" class="button ghost" type="button">Pause here</button>
          <button id="shuffle" class="button ghost" type="button" title="An endless slideshow of media from every link on this page (S)">Shuffle</button>
          <button id="inspector" class="button ghost" type="button" title="Outline every link by how ready it is (Ctrl+X, then X)">Inspector</button>
          <button id="mirror" class="button ghost" type="button" title="A window that shows your previews — drag it to a second monitor, minimise it, or press F11 there for full screen">Mirror</button>
        </div>
      </section>
      <section class="card">
        <div class="eyebrow">Performance</div>
        <div class="segmented full" role="radiogroup" aria-label="Performance">
          <button type="button" role="radio" class="segment" data-mode="auto" title="Prepares what this device handles comfortably and eases off when busy">Auto</button>
          <button type="button" role="radio" class="segment" data-mode="saver" title="Prepares nothing ahead">Data saver</button>
          <button type="button" role="radio" class="segment" data-mode="fast" title="Prepares more on capable machines">Fast</button>
        </div>
        <div class="eyebrow spaced">Open previews by</div>
        <div class="segmented full" role="radiogroup" aria-label="Open previews by">
          <button type="button" role="radio" class="segment" data-open="hover">Hovering</button>
          <button type="button" role="radio" class="segment" data-open="modifier">Alt + hover</button>
          <button type="button" role="radio" class="segment" data-open="click">Clicking</button>
        </div>
      </section>
      <section class="card">
        <div class="row"><div class="eyebrow">Saved links</div><span class="spacer"></span><span id="favoriteCount" class="muted">0</span></div>
        <div id="favorites" class="favorites"></div>
      </section>
    </div>
    <div class="actions">
      <button id="options" class="button" type="button">Settings</button>
      <button id="history" class="button" type="button">History</button>
      <button id="clear" class="button" type="button">Clear cache</button>
    </div>
    <footer class="footer muted">Private by design · no LinkPeek server · <a id="practice" href="#">Practice</a></footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
