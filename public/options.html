<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LinkPeek Settings</title><link rel="stylesheet" href="base.css"><style>.layout{display:grid;grid-template-columns:220px 1fr;gap:22px;padding:28px 0 64px}.side{position:sticky;top:20px;align-self:start}.side h2{font-size:18px;margin:8px 0 16px}.nav{display:grid;gap:4px}.nav button{text-align:left;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px}.nav button.active,.nav button:hover{background:var(--raised);color:var(--signal)}.main{min-width:0}.hero{padding:24px 0 26px}.hero h1{font-size:40px}.search{width:100%;height:44px;margin:20px 0}.section{margin:0 0 18px}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.section-head h2{font-size:18px}.modified{width:6px;height:6px;border-radius:50%;background:var(--signal)}.reset{font-size:11px;color:var(--muted);border:0;background:transparent}.value-num{font:700 11px ui-monospace,monospace;color:var(--signal);min-width:48px}.presetbar{display:flex;gap:8px;flex-wrap:wrap}.presetbar button.active{border-color:var(--signal);color:var(--signal)}.json{min-height:100px;font:12px ui-monospace,monospace}.save-state{font-size:11px;color:var(--signal)}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}}</style></head><body><div class="shell"><header class="top"><div class="mark">LP</div><div><div class="rex">REX TECHNOLOGIES</div><div class="brand">LinkPeek</div></div><span class="spacer"></span><span id="saved" class="save-state"></span><button id="tutorial" class="button ghost">Tutorial</button></header><div class="layout"><aside class="side"><div class="eyebrow">Configuration</div><h2>Settings</h2><nav id="nav" class="nav"></nav></aside><main class="main"><section class="hero"><div class="rex">CUSTOMIZE EVERYTHING</div><h1>Make LinkPeek <span>yours.</span></h1><p class="muted">Every interaction constant is configurable. Search by what you want to change.</p><input id="search" class="search" placeholder="Search settings — e.g. hover delay, zoom, avatars, cache…"><div id="presets" class="presetbar"></div></section><div id="sections"></div></main></div></div><script src="options.js"></script></body></html>
