<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LinkPeek Settings</title><link rel="stylesheet" href="base.css"><style>.layout{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:28px 0 64px}.side{position:sticky;top:20px;align-self:start}.side h2{font-size:18px;margin:8px 0 16px}.nav{display:grid;gap:4px;max-height:calc(100vh - 120px);overflow:auto}.nav button{text-align:left;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:8px}.nav button:hover{background:var(--raised);color:var(--text)}.main{min-width:0}.hero{padding:16px 0 26px}.hero h1{font-size:36px}.search{width:100%;height:46px;margin:20px 0 14px}.section{margin:0 0 10px;padding:0;overflow:hidden}.section-head{display:flex;align-items:center;gap:10px;padding:17px 19px;cursor:pointer;list-style:none}.section-head::-webkit-details-marker{display:none}.section-head:before{content:"+";color:var(--muted);font-size:18px;width:16px}.section[open]>.section-head:before{content:"−";color:var(--signal)}.section-head h2{font-size:16px}.section-count{font:700 11px ui-monospace,monospace;color:var(--muted)}.section-body{padding:0 19px 16px;border-top:1px solid var(--line)}.section-reset{display:block;margin:12px 0 0 auto}.modified{width:6px;height:6px;border-radius:50%;background:var(--signal)}.reset{font-size:11px;color:var(--muted);border:0;background:transparent}.value-num{font:700 11px ui-monospace,monospace;color:var(--signal);min-width:48px}.presetbar{display:flex;gap:8px;flex-wrap:wrap}.presetbar button.active{border-color:var(--signal);color:var(--signal)}.json{min-height:100px;font:12px ui-monospace,monospace}.save-state{font-size:11px;color:var(--signal)}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.hero h1{font-size:32px}}</style></head><body><div class="shell"><header class="top"><div class="mark">LP</div><div><div class="rex">REX TECHNOLOGIES</div><div class="brand">LinkPeek</div></div><span class="spacer"></span><span id="saved" class="save-state"></span><button id="tutorial" class="button ghost">Practice controls</button></header><div class="layout"><aside class="side"><div class="eyebrow">Settings</div><h2>Choose what to tune</h2><nav id="nav" class="nav"></nav></aside><main class="main"><section class="hero"><div class="rex">LINKPEEK</div><h1>Fast by default. <span>Yours when needed.</span></h1><p class="muted">Start with a preset, or search for one setting. Advanced sections stay out of the way until you open them.</p><input id="search" class="search" placeholder="Search settings — hover, scroll, preload, GIF…" aria-label="Search settings"><div id="presets" class="presetbar"></div></section><div id="sections"></div></main></div></div><script src="options.js"></script></body></html>
